schema_version = "1.3"

[task]
name = "rustlabs/crash-safe-kv-engine"
description = "Build a crash-safe, memory-bounded, ordered key-value storage engine (WAL, sorted tables, compaction, crash recovery) in std-only Rust, graded by randomized model checking, repeated SIGKILL crash recovery, a 2M-key scale test with an RSS cap, and disk-space bounds."
keywords = ["database", "storage-engine", "lsm-tree", "crash-recovery", "rust", "durability"]

[metadata]
difficulty = "hard"
category = "database-implementation"
expert_time_estimate_hours = 14

[agent]
timeout_sec = 72000.0
user = "agent"

[verifier]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 3072
storage_mb = 10240
network_mode = "no-network"
workdir = "/app/kvstore"
